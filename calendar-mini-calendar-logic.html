<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Calendar Logic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#fff; --fg:#101828; --fg2:#344054; --muted:#667085; --hint:#98a2b3;
  --line:#d0d5dd; --line2:#eaecf0; --soft:#f9fafb; --band:#f2f4f7;
  --accent:#2e5bff; --accent-soft:#eef2ff; --accent-ring:rgba(46,91,255,.18);
  --tip:#0c111d; --tipfg:#fff;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sh:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c111d; --fg:#f5f5f6; --fg2:#cecfd2; --muted:#94969c; --hint:#85888e;
  --line:#333741; --line2:#1f242f; --soft:#161b26; --band:#1f242f;
  --accent:#5b7fff; --accent-soft:#1a2348; --accent-ring:rgba(91,127,255,.25);
  --tip:#f5f5f6; --tipfg:#0c111d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111d; --fg:#f5f5f6; --fg2:#cecfd2; --muted:#94969c; --hint:#85888e;
  --line:#333741; --line2:#1f242f; --soft:#161b26; --band:#1f242f;
  --accent:#5b7fff; --accent-soft:#1a2348; --accent-ring:rgba(91,127,255,.25);
  --tip:#f5f5f6; --tipfg:#0c111d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.43 var(--font);
  padding:32px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
h2{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin:24px 0 12px;padding-top:20px;border-top:1px solid var(--line2)}
/* mini calendar */
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh b{font-weight:600}
.ib{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.ib:hover{background:var(--soft)}.ib:focus-visible{box-shadow:0 0 0 3px var(--accent-ring)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.mg .dw{text-align:center;font-size:12px;font-weight:500;color:var(--fg2);padding:4px 0}
.mg .wk{display:contents}
.md{all:unset;box-sizing:border-box;cursor:pointer;height:36px;display:grid;place-items:center;font-size:13px;color:var(--fg2);position:relative}
.md span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1}
.md.oth{color:var(--hint)}
.md.band{background:var(--band)}
.md.band.bs{border-radius:999px 0 0 999px}.md.band.be{border-radius:0 999px 999px 0}
.md.today span{color:var(--accent);font-weight:700}
.md.sel span{background:var(--accent);color:#fff;font-weight:600}
.md:hover span{box-shadow:inset 0 0 0 1px var(--line)}
.md:focus-visible span{box-shadow:0 0 0 3px var(--accent-ring)}
/* technicians */
.tech{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tech li{display:flex;align-items:center;gap:10px;padding:5px 0}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:#fff}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:500}.nm span{color:var(--muted);font-size:13px}
.bwrap{position:relative}
.badge{all:unset;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);background:var(--soft);color:var(--fg2);white-space:nowrap}
.badge:focus-visible{box-shadow:0 0 0 3px var(--accent-ring)}
.tip{position:absolute;right:0;top:calc(100% + 6px);background:var(--tip);color:var(--tipfg);font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.bwrap:hover .tip,.badge:focus-visible+.tip{opacity:1}
.flash{animation:fl .6s ease}
@keyframes fl{0%{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}100%{}}
/* log */
.log{margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px;min-height:42px}
.log b{color:var(--fg)}
/* main */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.ttl{flex:1;min-width:180px}.ttl b{font-size:18px;font-weight:600;display:block}.ttl span{color:var(--muted)}
.btn{all:unset;box-sizing:border-box;height:34px;min-width:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;font-weight:600;color:var(--fg2);box-shadow:var(--sh)}
.btn:focus-visible{box-shadow:0 0 0 4px var(--accent-ring)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--sh)}
.seg button{all:unset;cursor:pointer;padding:0 14px;height:32px;display:grid;place-items:center;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--fg)}
.seg button:focus-visible{box-shadow:inset 0 0 0 3px var(--accent-ring)}
.grid{border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.c{all:unset;box-sizing:border-box;cursor:pointer;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.cols .c:nth-child(7n){border-right:0}
.wv .c{min-height:260px}.mv .c{min-height:84px}
.c:hover:not(.sel){background:var(--soft)}
.c.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.c:focus-visible{box-shadow:inset 0 0 0 3px var(--accent-ring)}
.dh{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:var(--fg)}
.c.today .n,.dv .n.today{background:var(--accent);color:#fff}
.c.out .n{color:var(--hint)}
.ev{height:18px;border-radius:4px;background:var(--soft);border:1px solid var(--line2)}
.dv{padding:16px;min-height:260px;display:flex;flex-direction:column;gap:8px}
.dv .dh{font-size:14px}
.dv .ev{height:40px}
.anim{animation:sl .25s ease}
@keyframes sl{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
</style></head><body>

<div class="wrap">
  <aside>
    <div class="mh"><button class="ib" id="mPrev" aria-label="Previous month">‹</button><b id="mTitle"></b><button class="ib" id="mNext" aria-label="Next month">›</button></div>
    <div class="mg" id="mini" role="grid" aria-label="Mini calendar"></div>
    <h2>TECHNICIANS</h2>
    <ul class="tech" id="tech"></ul>
    <div class="log" id="log" aria-live="polite">Click a date in the mini calendar or in the grid.</div>
  </aside>
  <main>
    <div class="top">
      <div class="ttl"><b id="title"></b><span id="sub"></span></div>
      <button class="btn" id="prev" aria-label="Previous period">‹</button>
      <button class="btn" id="today">Today</button>
      <button class="btn" id="next" aria-label="Next period">›</button>
      <div class="seg" role="group" aria-label="View"><button data-v="day">Day</button><button data-v="week" aria-pressed="true">Week</button><button data-v="month">Month</button></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
const TODAY=new Date(2026,9,9);
const TECH=[{n:"Daniel Hughes",c:"Hughes Electrical",col:"#2e90fa"},{n:"Laura Bennett",c:"Bright Spark Solar",col:"#ee46bc"},{n:"Kevin Nguyen",c:"Nguyen Roofing",col:"#16b364"},{n:"Amara Okafor",c:"SunPath Installations",col:"#f79009"}];
const FIX={"2026-10-9":[3,6.5,4,1.5]};
const key=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function free(i,d){const k=key(d);if(FIX[k])return FIX[k][i];if(d.getDay()%6===0)return 0;
  let s=(d.getFullYear()*372+d.getMonth()*31+d.getDate())*7+i*131;s=(s*9301+49297)%233280;return Math.round((s/233280)*16)/2}
const fmt=h=>(h%1?h:h.toFixed(0))+"h";
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>add(d,-((d.getDay()+6)%7));
const lbl=d=>`${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
const S={view:"week",sel:new Date(TODAY),miniMonth:new Date(2026,9,1)};
const $=id=>document.getElementById(id);

function range(){ // period shown in grid, derived from selected day
  if(S.view==="day")return [S.sel,S.sel];
  if(S.view==="week"){const m=monday(S.sel);return [m,add(m,6)]}
  return [new Date(S.sel.getFullYear(),S.sel.getMonth(),1),new Date(S.sel.getFullYear(),S.sel.getMonth()+1,0)];
}
const inRange=(d,[a,b])=>d>=new Date(a.getFullYear(),a.getMonth(),a.getDate())&&d<=new Date(b.getFullYear(),b.getMonth(),b.getDate());

function select(d,src){
  const before=range(),moved=!inRange(d,before);
  S.sel=new Date(d);S.miniMonth=new Date(d.getFullYear(),d.getMonth(),1);
  $("log").innerHTML=moved
    ?`Clicked <b>${lbl(d)}</b> in the ${src} — outside the shown ${S.view}, so the grid moved there. View stays <b>${S.view[0].toUpperCase()+S.view.slice(1)}</b>.`
    :`Clicked <b>${lbl(d)}</b> in the ${src} — inside the shown ${S.view}, so the grid stays. Only the selection and badges changed.`;
  render(moved,true);
}
function renderMini(){
  const m=S.miniMonth,st=monday(m),[a,b]=range();
  $("mTitle").textContent=`${MONL[m.getMonth()]} ${m.getFullYear()}`;
  let h=["Mo","Tu","We","Th","Fr","Sa","Su"].map(x=>`<span class="dw">${x}</span>`).join("");
  for(let i=0;i<42;i++){const d=add(st,i),band=S.view!=="day"&&S.view!=="month"&&inRange(d,[a,b]);
    const cls=["md",d.getMonth()!==m.getMonth()?"oth":"",band?"band":"",band&&same(d,a)?"bs":"",band&&same(d,b)?"be":"",same(d,TODAY)?"today":"",same(d,S.sel)?"sel":""].join(" ");
    h+=`<button class="${cls}" data-d="${d.toISOString()}" aria-label="${lbl(d)}" aria-pressed="${same(d,S.sel)}"><span>${d.getDate()}</span></button>`}
  $("mini").innerHTML=h;
  $("mini").querySelectorAll(".md").forEach(b=>b.onclick=()=>select(new Date(b.dataset.d),"mini calendar"));
}
function renderTech(flash){
  $("tech").innerHTML=TECH.map((t,i)=>{const h=free(i,S.sel),ini=t.n.split(" ").map(x=>x[0]).join("");
    return `<li><span class="av" style="background:${t.col}">${ini}</span><span class="nm"><b>${t.n}</b><span>${t.c}</span></span>
    <span class="bwrap"><button class="badge${flash?" flash":""}" aria-describedby="tp${i}">${fmt(h)}</button><span class="tip" role="tooltip" id="tp${i}">${fmt(h)} free on ${lbl(S.sel)}</span></span></li>`}).join("");
}
function cellBtn(d,inPeriod){
  const cls=["c",same(d,TODAY)?"today":"",same(d,S.sel)?"sel":"",inPeriod?"":"out"].join(" ");
  const ev=inPeriod&&d.getDay()%6?'<span class="ev"></span><span class="ev" style="width:65%"></span>':"";
  return `<button class="${cls}" data-d="${d.toISOString()}" aria-label="${lbl(d)}" aria-pressed="${same(d,S.sel)}"><span class="dh">${S.view==="week"?DOW[d.getDay()]:""}<span class="n">${d.getDate()}</span></span>${ev}</button>`;
}
function render(moved,flash){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===S.view)));
  const [a,b]=range(),g=$("grid");
  if(S.view==="day"){
    $("title").textContent=`${MONL[a.getMonth()]} ${a.getFullYear()}`;$("sub").textContent=lbl(a)+" "+a.getFullYear();
    g.innerHTML=`<div class="dv"><span class="dh"><span class="n${same(a,TODAY)?" today":""}">${a.getDate()}</span>${DOW[a.getDay()]}</span>${a.getDay()%6?'<span class="ev"></span><span class="ev" style="width:70%"></span>':'<span style="color:var(--hint)">Day off</span>'}</div>`;
  }else if(S.view==="week"){
    $("title").textContent=`${MONL[a.getMonth()]} ${a.getFullYear()}`;$("sub").textContent=`${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`;
    g.innerHTML=`<div class="cols wv">${[...Array(7)].map((_,i)=>cellBtn(add(a,i),true)).join("")}</div>`;
  }else{
    const st=monday(a);$("title").textContent=`${MONL[a.getMonth()]} ${a.getFullYear()}`;$("sub").textContent=`1 – ${b.getDate()} ${MON[a.getMonth()]}`;
    g.innerHTML=`<div class="cols mv">${[...Array(42)].map((_,i)=>{const d=add(st,i);return cellBtn(d,d.getMonth()===a.getMonth())}).join("")}</div>`;
  }
  if(moved){g.firstElementChild.classList.add("anim")}
  g.querySelectorAll(".c").forEach(c=>c.onclick=()=>select(new Date(c.dataset.d),"grid"));
  renderMini();renderTech(flash);
}
function step(n){
  if(S.view==="day")S.sel=add(S.sel,n);else if(S.view==="week")S.sel=add(S.sel,7*n);
  else{const t=new Date(S.sel.getFullYear(),S.sel.getMonth()+n,1);const dd=Math.min(S.sel.getDate(),new Date(t.getFullYear(),t.getMonth()+1,0).getDate());S.sel=new Date(t.getFullYear(),t.getMonth(),dd)}
  S.miniMonth=new Date(S.sel.getFullYear(),S.sel.getMonth(),1);
  $("log").innerHTML=`Arrows move the grid by one ${S.view}; the selected day moves with it (<b>${lbl(S.sel)}</b>).`;render(true,true);
}
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("today").onclick=()=>{select(new Date(TODAY),"Today button")};
$("mPrev").onclick=()=>{S.miniMonth=new Date(S.miniMonth.getFullYear(),S.miniMonth.getMonth()-1,1);$("log").innerHTML="Mini calendar arrows only browse months — the grid does not move until you click a date.";renderMini()};
$("mNext").onclick=()=>{S.miniMonth=new Date(S.miniMonth.getFullYear(),S.miniMonth.getMonth()+1,1);$("log").innerHTML="Mini calendar arrows only browse months — the grid does not move until you click a date.";renderMini()};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;$("log").innerHTML=`View changed to <b>${b.textContent}</b>; the selected day (${lbl(S.sel)}) stays and the grid shows the ${S.view} that contains it.`;render(true,false)});
render(false,false);
</script>

</body></html>
