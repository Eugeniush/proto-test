}

function remainingStops(){ const k = key(S.cursor); return routeStops().filter(e=>e.status!=='Completed' && !(k===key(TODAY) && e.start+e.dur<=NOW_MIN)); }
async function routeLate(min){
  S.routeAI = {loading:'Re-timing the day and checking arrival windows'}; renderLeft(); await wait(1300);
  const st = remainingStops();
  const rows = st.map(e=>({e, ns:e.start+min, notify: min >= (e.arrival||30)}));
  S.routeAI = {kind:'late', min, rows};
  renderLeft();
}
async function routeSick(){
  S.routeAI = {loading:'Finding cover for each visit'}; renderLeft(); await wait(1600);
  const sick = S.routeRes, k = key(S.cursor), taken = [];
  const rows = remainingStops().map(e=>{
    const pool = [...CAND[e.ty], ...CAND.svc, ...CAND.ins].filter((x,i,a)=>x!==sick && a.indexOf(x)===i);
    const pid = pool.find(x=>isFree(x,k,e.start,e.dur) && !taken.some(t=>t.pid===x && t.s<e.start+e.dur && t.e>e.start));
    if(pid) taken.push({pid,s:e.start,e:e.start+e.dur});
    return {e, pid, near: pid?nearestMin(pid,k,e.cust):null};
  });
  S.routeAI = {kind:'sick', rows};
  renderLeft();
}
function routeAIBlock(){
  const r = S.routeAI;
  if(r && r.loading) return thinking(r.loading,[80,60]);
  if(r && r.kind==='late'){
    const n = r.rows.filter(x=>x.notify).length;
    return `<div class="aib"><div class="aib-h">${I.ai}Running ${r.min} min late</div>
      <div class="slots">${r.rows.map(x=>`<div class="slot"><span><b>${custName(x.e)}</b></span><span class="${x.notify?'warn':'ar'}">${fmtT(x.e.start)} → ${fmtT(x.ns)}</span></div>`).join('')}</div>
      <p>${n} customer${n!==1?'s':''} will be outside their arrival window. AI drafted an SMS:</p>
      <div class="sms"><small>To ${r.rows.filter(x=>x.notify).map(x=>custName(x.e)).join(', ')}</small>Hi {first name}, ${FIRST(S.routeRes)} from Acme Corp is running about ${r.min} min late. New arrival time: {time}. Sorry for the wait!</div>
      <div class="acts"><button class="btn sm pri" onclick="applyLate()">${I.send}Update times & send ${n} SMS</button><button class="lnkbtn" onclick="S.routeAI=null;renderLeft()">Cancel</button></div></div>`;
  }
  if(r && r.kind==='sick'){
    const un = r.rows.filter(x=>!x.pid);
    return `<div class="aib"><div class="aib-h">${I.ai}Cover for ${FIRST(S.routeRes)}’s day</div>
      <div class="slots">${r.rows.map(x=>`<div class="slot"><span><b>${fmtT(x.e.start)}</b> ${custName(x.e)}</span>${x.pid?`<span class="ar">→ ${shortName(PNAME(x.pid))}</span>`:`<span class="warn">→ Unscheduled</span>`}</div>`).join('')}</div>
      <p>${r.rows.length-un.length} visit${r.rows.length-un.length!==1?'s':''} covered by people free at the same time.${un.length?` ${un.length} can’t be covered — AI moves ${un.length>1?'them':'it'} to Unscheduled and texts the customer${un.length>1?'s':''}.`:''}</p>
      ${un.length?`<div class="sms"><small>To ${un.map(x=>custName(x.e)).join(', ')}</small>Hi {first name}, sorry — your technician is unwell today. We’ll call you to book a new time for your visit. — Acme Corp</div>`:''}
      <div class="acts"><button class="btn sm pri" onclick="applySick()">Apply changes</button><button class="lnkbtn" onclick="S.routeAI=null;renderLeft()">Cancel</button></div></div>`;
  }
  return `<div class="aib"><div class="aib-h">${I.ai}Day changed?</div><p>Tell AI what happened — it re-plans ${FIRST(S.routeRes)}’s day and drafts messages to customers.</p>
    <div class="acts"><button class="btn sm ai" onclick="routeLate(30)">${I.clock}Running 30 min late</button><button class="btn sm ai" onclick="routeSick()">${I.alert}Off sick</button></div></div>`;
}
function applyLate(){
  const r = S.routeAI, snap = r.rows.map(x=>({e:x.e,start:x.e.start}));
  r.rows.forEach(x=>{ x.e.start = x.ns; x.e.ai = true; });
  S.undo = () => snap.forEach(x=>{ x.e.start = x.start; });
  const n = r.rows.filter(x=>x.notify).length; S.routeAI = null; render();
  toast('Day re-timed',`${r.rows.length} visits moved ${r.min} min later · ${n} SMS sent`,true);
}
function applySick(){
  const r = S.routeAI, sick = S.routeRes, snap = [], moved = [];
  r.rows.forEach(x=>{
    const e = x.e; snap.push({e,res:[...e.res]});
    if(x.pid){ e.res = e.res.filter(id=>id!==sick && id!==R[sick].team); e.res.push(x.pid); if(R[x.pid].team) e.res.push(R[x.pid].team); e.ai = true; }
    else { const i = EV.indexOf(e); EV.splice(i,1); const p = {id:'u'+e.id,list:'unscheduled',title:e.title,rec:e.rec,num:e.num,cust:e.cust,ty:e.ty,dur:e.dur,sug:null,req:`Rebook — technician sick on ${dLabel(e.date)}.`}; POOL.unshift(p); moved.push({e,p}); }
  });
  S.undo = () => { snap.forEach(x=>x.e.res = x.res); moved.forEach(m=>{ EV.push(m.e); POOL = POOL.filter(p=>p!==m.p); }); };
  S.routeAI = null; render();
  toast(`${FIRST(sick)}’s day covered`,`${r.rows.length-moved.length} visits reassigned · ${moved.length} moved to Unscheduled`,true);
}

  ['Customer asks to reschedule','AI reads the SMS, finds a slot, drafts the reply',()=>reviewSophie()],
  ['Scheduler · suggestions on cards','Slot + person ready on every card · one click to book',()=>{ S.schedTab='Jobs'; S.closed.unscheduled=false; setMode('scheduler'); }],
  ['Scheduler · Incomplete next steps','AI reads the technician’s note',()=>{ S.schedTab='Jobs'; S.closed.incomplete=false; S.closed.unscheduled=true; setMode('scheduler'); }],
  ['Route · running late / off sick','Algorithm re-plans · AI drafts messages',()=>{ S.routeRes='p2'; S.routeAI=null; S.cursor=parse('2026-10-13'); setMode('route'); }],
];
function renderGuide(){
  const g = document.getElementById('guide'); if(!g) return;
  g.innerHTML = `<div class="guide"><div class="guide-h" onclick="S.guideOpen=!S.guideOpen;renderGuide()">${I.ai}AI demo <small>· everything is simulated</small><span class="tg">${S.guideOpen?'–':'+'}</span></div>
    ${S.guideOpen?`<ol>${GUIDE.map(([t,s],i)=>`<li><button onclick="S.guideOpen=false;closeDrawer();closeModal();GUIDE[${i}][2]();renderGuide()"><b>${i+1}. ${t}</b><span>${s}</span></button></li>`).join('')}</ol>
    <div class="gf"><span>✦ marks events booked or moved by AI</span><button onclick="location.reload()">Restart</button></div>`:''}</div>`;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('mousedown', e=>{
  if(S.askOpen && !e.target.closest('.askwrap')){ S.askOpen=false; renderToolbar(); }
  if(S.fOpen && !e.target.closest('.fwrap')){ S.fOpen=false; renderToolbar(); }
  if(S.rmenu && !e.target.closest('.rcard')){ S.rmenu=null; renderLeft(); }
});

render();
</script>
</body>
