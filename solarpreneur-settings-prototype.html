<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solarpreneur — Admin Settings (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary-25:#F5F8FF; --primary-50:#EFF4FF; --primary-100:#D1E0FF; --primary-500:#155EEF; --primary-600:#0F4FDB; --primary-700:#0040C1;
    --gray-25:#FCFCFD; --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#EAECF0; --gray-300:#D0D5DD; --gray-400:#98A2B3;
    --gray-500:#667085; --gray-600:#475467; --gray-700:#344054; --gray-800:#1D2939; --gray-900:#101828;
    --success-50:#ECFDF3; --success-500:#12B76A; --success-700:#027A48;
    --warning-50:#FFFAEB; --warning-500:#F79009; --warning-700:#B54708;
    --error-50:#FEF3F2; --error-500:#F04438; --error-700:#B42318;
    --purple-50:#F4F3FF; --purple-600:#6938EF; --purple-700:#5925DC;
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
    --shadow-xs: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-sm: 0 1px 3px rgba(16,24,40,0.1), 0 1px 2px rgba(16,24,40,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--gray-900); background:var(--gray-50); font-size:14px;}
  a{color:inherit;}

  /* ---------- App shell ---------- */
  .app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:296px; min-width:296px; background:#fff; border-right:1px solid var(--gray-200); display:flex; flex-direction:column; overflow:hidden;}
  .sidebar-header{padding:20px 20px 16px; border-bottom:1px solid var(--gray-200);}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .brand-mark{width:30px; height:30px; border-radius:8px; background:var(--primary-500); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex-shrink:0;}
  .brand-name{font-weight:600; font-size:14px; color:var(--gray-900);}
  .brand-sub{font-size:12px; color:var(--gray-500);}
  .crumb{font-size:12px; color:var(--gray-500); display:flex; align-items:center; gap:6px;}
  .crumb b{color:var(--gray-700); font-weight:600;}
  .search-box{margin:14px 20px 6px; position:relative;}
  .search-box input{width:100%; padding:8px 12px 8px 34px; border:1px solid var(--gray-300); border-radius:var(--radius-md); font-size:13px; font-family:inherit; outline:none; background:var(--gray-25);}
  .search-box input:focus{border-color:var(--primary-500); box-shadow:0 0 0 4px var(--primary-50);}
  .search-box svg{position:absolute; left:11px; top:9px; width:15px; height:15px; color:var(--gray-400);}

  .nav-scroll{flex:1; overflow-y:auto; padding:8px 12px 24px;}
  .nav-group{margin-top:4px; border-bottom:1px solid var(--gray-100); padding-bottom:4px;}
  .nav-group:last-child{border-bottom:none;}

  /* Level 1 — group header (Defaults, Settings, Templates...) */
  .nav-group-header{display:flex; align-items:center; gap:9px; padding:9px 8px; border-radius:var(--radius-sm); cursor:pointer; user-select:none;}
  .nav-group-header:hover{background:var(--gray-50);}
  .nav-group-header .icon{width:17px; height:17px; color:var(--gray-500); flex-shrink:0;}
  .nav-group-header .title{flex:1; font-size:13.5px; font-weight:600; color:var(--gray-900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-group-header .count{font-size:12px; font-weight:600; color:var(--gray-600); background:var(--gray-100); padding:2px 9px; border-radius:20px; flex-shrink:0;}
  .nav-group-header .chevron{width:13px; height:13px; color:var(--gray-400); flex-shrink:0; transition:transform .15s ease;}
  .nav-group.collapsed .chevron{transform:rotate(180deg);}
  .nav-group.has-active .nav-group-header .title{color:var(--primary-700);}

  /* Level 2 — items under a group */
  .nav-group-items{padding:2px 0 6px 0; overflow:hidden;}
  .nav-group.collapsed .nav-group-items{display:none;}

  .nav-item{display:flex; align-items:center; gap:9px; padding:7px 8px 7px 33px; border-radius:var(--radius-sm); cursor:pointer; color:var(--gray-700); font-size:13.5px; font-weight:500; margin-bottom:1px; position:relative;}
  .nav-item:hover{background:var(--gray-50);}
  .nav-item.active{background:var(--primary-50); color:var(--primary-700);}
  .nav-item.active .dot{background:var(--primary-500);}
  .nav-item .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--gray-300);}
  .nav-item .dot.built{background:var(--success-500);}
  .nav-item .label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .tag{font-size:10px; font-weight:700; padding:1px 6px; border-radius:20px; background:var(--gray-100); color:var(--gray-500); flex-shrink:0;}
  .nav-item.active .tag{background:#fff;}

  .sidebar-footer{padding:14px 20px; border-top:1px solid var(--gray-200); font-size:11.5px; color:var(--gray-400); line-height:1.5;}

  /* ---------- Main ---------- */
  .main{flex:1; overflow-y:auto; background:var(--gray-50);}
  .topbar{position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--gray-200); padding:16px 40px; display:flex; align-items:center; justify-content:space-between;}
  .topbar-title{font-size:18px; font-weight:600; color:var(--gray-900);}
  .topbar-desc{font-size:13px; color:var(--gray-500); margin-top:2px;}
  .source-pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--gray-500); background:var(--gray-100); padding:5px 10px; border-radius:20px;}

  .content{max-width:860px; margin:0 auto; padding:32px 40px 120px;}

  .panel{background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-lg); margin-bottom:20px; overflow:hidden;}
  .panel-head{padding:18px 24px; border-bottom:1px solid var(--gray-200);}
  .panel-head h3{margin:0 0 3px; font-size:15px; font-weight:600; color:var(--gray-900);}
  .panel-head p{margin:0; font-size:13px; color:var(--gray-500);}
  .panel-body{padding:22px 24px;}

  .field-row{display:flex; align-items:flex-start; gap:24px; padding:16px 0; border-bottom:1px solid var(--gray-100);}
  .field-row:last-child{border-bottom:none;}
  .field-label{width:220px; flex-shrink:0; padding-top:8px;}
  .field-label .name{font-size:13.5px; font-weight:500; color:var(--gray-700);}
  .field-label .hint{font-size:12px; color:var(--gray-500); margin-top:3px; line-height:1.5;}
  .field-control{flex:1; max-width:340px;}

  select, input[type=text], input[type=number], input[type=date]{
    width:100%; padding:8px 12px; border:1px solid var(--gray-300); border-radius:var(--radius-md);
    font-family:inherit; font-size:13.5px; color:var(--gray-900); background:#fff; outline:none; appearance:none;
  }
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1L6 6L11 1' stroke='%23667085' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:32px;}
  select:focus, input:focus{border-color:var(--primary-500); box-shadow:0 0 0 4px var(--primary-50);}

  .segmented{display:inline-flex; border:1px solid var(--gray-300); border-radius:var(--radius-md); overflow:hidden;}
  .segmented button{border:none; background:#fff; padding:8px 16px; font-family:inherit; font-size:13.5px; font-weight:500; color:var(--gray-600); cursor:pointer; border-right:1px solid var(--gray-300);}
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--primary-50); color:var(--primary-700);}

  .toggle{width:36px; height:20px; border-radius:20px; background:var(--gray-200); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:var(--shadow-xs); transition:left .15s;}
  .toggle.on{background:var(--primary-500);}
  .toggle.on::after{left:18px;}

  .radio-list{display:flex; flex-direction:column; gap:8px;}
  .radio-option{display:flex; align-items:flex-start; gap:11px; padding:11px 13px; border:1px solid var(--gray-300); border-radius:var(--radius-md); cursor:pointer;}
  .radio-option:hover{border-color:var(--gray-400);}
  .radio-option.selected{border-color:var(--primary-500); background:var(--primary-25);}
  .radio-option .circle{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--gray-300); flex-shrink:0; margin-top:1px; position:relative; background:#fff;}
  .radio-option.selected .circle{border-color:var(--primary-500);}
  .radio-option.selected .circle::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--primary-500);}
  .radio-option .rtext{font-size:13.5px; color:var(--gray-800); font-weight:500; line-height:1.4;}
  .radio-option .rdesc{font-size:12px; color:var(--gray-500); margin-top:2px; line-height:1.5;}

  .check-option{display:flex; align-items:flex-start; gap:11px; padding:11px 13px; border:1px solid var(--gray-300); border-radius:var(--radius-md); cursor:pointer;}
  .check-option:hover{border-color:var(--gray-400);}
  .check-option.checked{border-color:var(--primary-500); background:var(--primary-25);}
  .check-option .box{width:16px; height:16px; border-radius:5px; border:1.5px solid var(--gray-300); flex-shrink:0; margin-top:1px; position:relative; background:#fff;}
  .check-option.checked .box{border-color:var(--primary-500); background:var(--primary-500);}
  .check-option.checked .box::after{content:""; position:absolute; left:4px; top:1px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg);}
  .check-option .rtext{font-size:13.5px; color:var(--gray-800); font-weight:500;}

  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .chip{display:inline-flex; align-items:center; gap:8px; padding:6px 8px 6px 14px; border-radius:20px; background:var(--gray-100); font-size:13px; font-weight:500; color:var(--gray-700);}
  .chip button{border:none; background:var(--gray-300); color:#fff; width:16px; height:16px; border-radius:50%; cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .chip button:hover{background:var(--gray-400);}
  .chip-add-row{display:flex; gap:8px;}
  .chip-add-row input{flex:1;}

  .inline-input-sm{width:100%; max-width:120px;}
  .subtle-label{font-size:11.5px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:.02em; margin-bottom:8px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;}
  .stat-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--gray-100);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .name{font-size:13.5px; color:var(--gray-700); font-weight:500;}
  .stat-row .count{font-size:13.5px; font-weight:600; color:var(--gray-900);}

  .btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius-md); font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid var(--gray-300); background:#fff; color:var(--gray-700);}
  .btn:hover{background:var(--gray-50);}
  .btn-primary{background:var(--primary-500); border-color:var(--primary-500); color:#fff;}
  .btn-primary:hover{background:var(--primary-600);}
  .btn-sm{padding:6px 10px; font-size:12.5px;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .badge-hypo{background:var(--purple-50); color:var(--purple-600);}
  .badge-warn{background:var(--warning-50); color:var(--warning-700);}
  .badge-success{background:var(--success-50); color:var(--success-700);}
  .badge-gray{background:var(--gray-100); color:var(--gray-500);}

  .banner{display:flex; gap:10px; padding:12px 16px; border-radius:var(--radius-md); font-size:13px; line-height:1.5; margin-bottom:18px;}
  .banner-warn{background:var(--warning-50); color:var(--warning-700); border:1px solid #FEDF89;}
  .banner-info{background:var(--primary-50); color:var(--primary-700); border:1px solid var(--primary-100);}
  .banner svg{flex-shrink:0; margin-top:1px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11.5px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.02em; padding:10px 14px; border-bottom:1px solid var(--gray-200); background:var(--gray-25);}
  td{padding:12px 14px; border-bottom:1px solid var(--gray-100); vertical-align:middle; color:var(--gray-700);}
  tr:last-child td{border-bottom:none;}
  .row-name{font-weight:500; color:var(--gray-900);}
  .row-note{font-size:12px; color:var(--gray-500); margin-top:2px;}

  .prefix-row{display:flex; align-items:center; gap:10px;}
  .prefix-row input{width:100%;}
  .prefix-preview{font-family:'SF Mono',Consolas,monospace; font-size:13px; background:var(--gray-100); color:var(--gray-700); padding:8px 12px; border-radius:var(--radius-md); white-space:nowrap;}

  .pill-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .pill{padding:6px 14px; border-radius:20px; border:1px solid var(--gray-300); font-size:13px; font-weight:500; color:var(--gray-600); cursor:pointer; background:#fff;}
  .pill.active{background:var(--primary-500); border-color:var(--primary-500); color:#fff;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--gray-500);}
  .empty-state svg{margin-bottom:10px; color:var(--gray-300);}
  .empty-state p{margin:0; font-size:13.5px;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 20px;}
  .form-field label{display:block; font-size:13px; font-weight:500; color:var(--gray-700); margin-bottom:6px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; padding-top:26px;}
  .checkbox-row input{width:16px; height:16px; accent-color:var(--primary-500);}

  .placeholder-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center;}
  .placeholder-icon{width:56px; height:56px; border-radius:16px; background:var(--gray-100); display:flex; align-items:center; justify-content:center; color:var(--gray-400); margin-bottom:18px;}
  .placeholder-wrap h3{font-size:16px; margin:0 0 8px; color:var(--gray-900);}
  .placeholder-wrap p{font-size:13.5px; color:var(--gray-500); max-width:420px; line-height:1.6; margin:0 0 16px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gray-900); color:#fff; padding:12px 20px; border-radius:var(--radius-md); font-size:13.5px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-sm); opacity:0; pointer-events:none; transition:all .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{color:var(--success-500);}
</style>
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-name">Solarpreneur</div>
        </div>
      </div>
      <div class="crumb">Admin / <b id="crumb-current">Settings</b></div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Search Settings..." id="nav-search">
    </div>
    <nav class="nav-scroll" id="nav-scroll"></nav>
    <div class="sidebar-footer">
      🟢 = built and interactive · ⚪ = mapped from the structure, not yet built<br>
      Data source: <i>Admin (Sample Only).xlsx</i> from Ahmed
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="page-title">General</div>
        <div class="topbar-desc" id="page-desc">Core system settings</div>
      </div>
      <div class="source-pill" id="source-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        DEFAULTS &gt; General
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="toast" id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toast-text">Saved</span>
</div>

<script>
/* =========================================================================
   DATA — navigation assembled from the MENU STRUCTURE tab + actual content of the xlsx
   ========================================================================= */
const NAV = [
  { group: "Defaults", items: [
    { id:"general", label:"General", built:true },
    { id:"lockdates", label:"Lock Dates", built:true },
    { id:"quote-defaults", label:"Quote", built:true },
    { id:"jobs-defaults", label:"Jobs", built:true },
    { id:"email-defaults", label:"Email", built:true },
    { id:"marketing-defaults", label:"Marketing", built:true },
    { id:"menu-defaults", label:"Menu", built:true },
    { id:"tasks-defaults", label:"Tasks", built:true },
    { id:"payments-defaults", label:"Payments", built:true },
    { id:"accounting-defaults", label:"Accounting", built:true },
    { id:"taxrates-defaults", label:"Tax Rates", built:true },
    { id:"invoice-defaults", label:"Invoice", built:true },
    { id:"commissions-defaults", label:"Commissions", built:true },
    { id:"employees-defaults", label:"Employees", built:true },
    { id:"quotecart-defaults", label:"Quote Cart", built:true },
    { id:"schedule-defaults", label:"Schedule", built:true },
    { id:"stock-defaults", label:"Stock", built:true },
    { id:"timesheets-defaults", label:"Timesheets", built:true },
    { id:"leads-defaults", label:"Leads", built:true },
    { id:"purchases-defaults", label:"Purchases", built:true },
    { id:"renamefields-defaults", label:"Rename Fields", built:true },
    { id:"transactionnumbers-defaults", label:"Transaction Numbers", built:true },
    { id:"customfieldcounts-defaults", label:"Custom Fields (counts)", built:true },
  ]},
  { group: "Settings", items: [
    { id:"autonumbering", label:"Auto-Numbering", built:true },
    { id:"customfields", label:"Custom Fields", built:true },
    { id:"catalog", label:"Catalog", built:true },
    { id:"customers-settings", label:"Customers · Contact Type & Role", built:true },
    { id:"leads-settings", label:"Leads · Status, Source, Owners…", built:true },
    { id:"quotes-settings", label:"Quotes · Types, Validity, Mark Up…", built:true },
    { id:"jobs-settings", label:"Jobs · Type, Priorities…", built:true },
    { id:"operations", label:"Operations · Schedule Types", built:true },
    { id:"purchasing", label:"Purchasing · PO Status", built:true },
    { id:"stock-settings", label:"Stock · Locations, Allocation…", built:true },
    { id:"resources", label:"Resources · Pay Rates, Leaves…", built:true },
    { id:"timesheets-settings", label:"Timesheets", built:true },
    { id:"stcs", label:"STCs", built:true },
    { id:"import", label:"Import", built:true },
    { id:"communication", label:"Communication", built:true },
    { id:"forms", label:"Forms", built:true },
  ]},
  { group: "Templates", items: [
    { id:"sms-templates", label:"SMS Templates", built:true },
    { id:"email-templates", label:"Email Templates", built:true },
    { id:"document-templates", label:"Document Templates", built:true },
  ]},
  { group: "Accounting", items: [
    { id:"finance-providers", label:"Finance Providers", built:true },
  ]},
  { group: "Organisation", items: [
    { id:"org-details", label:"Organisation Details", built:true },
    { id:"org-branding", label:"Branding", built:true },
    { id:"org-licenses", label:"Invoicing, Licenses & Records", built:true },
  ]},
  { group: "Franchisee", items: [
    { id:"territory", label:"Territory Management", built:true },
    { id:"franchisee-directory", label:"Franchisee Directory & Setup", built:true },
  ]},
  { group: "Portal", items: [
    { id:"customer-portal", label:"Customer Portal", built:true },
  ]},
];

const TIER_LABEL = { D:"Detailed in file", S:"Sparse in file", E:"Empty in file" };
const TIER_BADGE = { D:"badge-success", S:"badge-warn", E:"badge-gray" };

/* =========================================================================
   RENDER NAV
   ========================================================================= */
const navScroll = document.getElementById('nav-scroll');

// Which level-1 groups are currently expanded. "Defaults" open by default.
const expandedGroups = new Set(["Defaults"]);

const FOLDER_ICON = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`;
const CHEVRON_ICON = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>`;

function renderNav(filter=""){
  navScroll.innerHTML = "";
  NAV.forEach(group => {
    const items = group.items.filter(it => it.label.toLowerCase().includes(filter.toLowerCase()));
    if(!items.length) return;

    const hasActive = items.some(it => it.id === currentId);
    const isExpanded = filter ? true : expandedGroups.has(group.group);

    const g = document.createElement('div');
    g.className = 'nav-group' + (isExpanded ? '' : ' collapsed') + (hasActive ? ' has-active' : '');

    // Level 1 — group header
    const header = document.createElement('div');
    header.className = 'nav-group-header';
    header.innerHTML = `${FOLDER_ICON}<span class="title">${group.group}</span><span class="count">${items.length}</span>${CHEVRON_ICON}`;
    header.addEventListener('click', () => {
      if(expandedGroups.has(group.group)) expandedGroups.delete(group.group);
      else expandedGroups.add(group.group);
      renderNav(document.getElementById('nav-search').value);
    });
    g.appendChild(header);

    // Level 2 — items
    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'nav-group-items';
    items.forEach(it => {
      const el = document.createElement('div');
      el.className = 'nav-item' + (it.id === currentId ? ' active' : '');
      el.dataset.id = it.id;
      el.innerHTML = `<span class="dot ${it.built?'built':''}"></span><span class="label">${it.label}</span>` +
        (!it.built ? `<span class="tag">${it.tier}</span>` : '');
      el.addEventListener('click', () => navigateTo(it.id));
      itemsWrap.appendChild(el);
    });
    g.appendChild(itemsWrap);

    navScroll.appendChild(g);
  });
}

document.getElementById('nav-search').addEventListener('input', e => renderNav(e.target.value));

document.getElementById('content').addEventListener('click', (e) => {
  const radioOpt = e.target.closest('.radio-option');
  if(radioOpt){
    const group = radioOpt.closest('[data-radio-group]');
    group.querySelectorAll('.radio-option').forEach(o=>o.classList.remove('selected'));
    radioOpt.classList.add('selected');
    toast('Saved');
    return;
  }
  const checkOpt = e.target.closest('.check-option');
  if(checkOpt){
    checkOpt.classList.toggle('checked');
    toast('Saved');
    return;
  }
  const genToggle = e.target.closest('.toggle[data-generic]');
  if(genToggle){
    genToggle.classList.toggle('on');
    toast('Saved');
    return;
  }
  const listRemove = e.target.closest('[data-list-remove]');
  if(listRemove){
    const kind = listRemove.dataset.listRemove;
    LISTS[kind].splice(parseInt(listRemove.dataset.index), 1);
    render();
    toast('Removed');
    return;
  }
  const listAdd = e.target.closest('[data-list-add]');
  if(listAdd){
    const kind = listAdd.dataset.listAdd;
    const input = document.getElementById('add-list-'+kind);
    const val = input.value.trim();
    if(!val) return;
    LISTS[kind].push(val);
    render();
    toast('Added');
    return;
  }
});

let paymentMethods = ["Deposit","Progress Payment","Balance","Goodwill Credit","Write Off"];
let paymentTerms = ["COD","After Installation","After Connection","Last Day of the Month","30 Days from Invoice"];
function chipListHtml(items, kind){
  return `<div class="chip-list">${items.map((t,i)=>`<div class="chip">${t}<button data-remove="${kind}" data-index="${i}">&times;</button></div>`).join('')}</div>
  <div class="chip-add-row"><input type="text" placeholder="Add new..." id="add-${kind}"><button class="btn btn-sm" data-add="${kind}">Add</button></div>`;
}
function pagePaymentsDefaults(){
  return panel("Payments", "Configure the payment methods, terms, and gateway used across Quotes, Jobs, and Invoices.",
    `<div class="subtle-label">Payment Methods</div>` + chipListHtml(paymentMethods,"method") +
    `<div style="height:22px;"></div><div class="subtle-label">Payment Terms</div>` + chipListHtml(paymentTerms,"term") +
    `<div style="height:22px;"></div>` +
    fieldRow("Payment Gateway", null, `<select><option>Stripe</option><option>PayPal</option><option>EzyFinance</option><option>None</option></select>`)
  );
}
function afterPaymentsDefaults(){
  document.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const kind = b.dataset.remove, idx = parseInt(b.dataset.index);
      if(kind==="method") paymentMethods.splice(idx,1); else paymentTerms.splice(idx,1);
      render(); toast('Removed');
    });
  });
  document.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const kind = b.dataset.add;
      const input = document.getElementById('add-'+kind);
      const val = input.value.trim();
      if(!val) return;
      if(kind==="method") paymentMethods.push(val); else paymentTerms.push(val);
      render(); toast('Added');
    });
  });
}

function afterQuotesSettings(){
  const group = document.querySelector('[data-radio-group="markup-method"]');
  const conditional = document.getElementById('markup-conditional');
  group.querySelectorAll('.radio-option').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(opt.dataset.index === '1'){
        conditional.innerHTML = fieldRow("System Default Mark Up", null, `<div style="display:flex; align-items:center; gap:8px;"><input type="number" value="20" style="max-width:100px;"><span style="color:var(--gray-500);">%</span></div>`);
      } else if(opt.dataset.index === '2'){
        conditional.innerHTML = fieldRow("Min Markup %", null, `<input type="number" value="10" style="max-width:100px;">`) +
          fieldRow("Max Markup %", null, `<input type="number" value="35" style="max-width:100px;">`);
      } else {
        conditional.innerHTML = `<div style="font-size:12.5px; color:var(--gray-500);">No extra fields — the markup is set individually on each line item.</div>`;
      }
    });
  });
  document.querySelectorAll('[data-segmented] button').forEach(b=>{
    b.addEventListener('click', ()=>{ b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); toast('Saved'); });
  });
}

let currentId = "general";

function navigateTo(id){
  currentId = id;
  const item = findNavItem(id);
  if(item) expandedGroups.add(item.group);
  render();
}

function render(){
  const built = PAGES[currentId];
  const item = findNavItem(currentId);
  document.getElementById('page-title').textContent = item ? item.label : (built ? built.title : "");
  document.getElementById('page-desc').textContent = built ? built.desc : (item ? `Source: tab "${item.sheet}" in the xlsx` : "");
  document.getElementById('source-pill').innerHTML = `
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    ${built ? built.source : (item ? (item.group + ' › ' + item.sheet) : '')}`;

  const content = document.getElementById('content');
  if(built){
    content.innerHTML = built.render();
    if(built.after) built.after();
  } else if(item){
    content.innerHTML = pagePlaceholder(item);
  } else {
    content.innerHTML = `<div class="empty-state"><p>Section not found.</p></div>`;
  }
  renderNav(document.getElementById('nav-search').value);
}

render();
